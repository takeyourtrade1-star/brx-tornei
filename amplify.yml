version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.18.1
        - nvm use 24.18.1
        - node --version
        - npm ci --ignore-scripts --cache .npm --prefer-offline
        - node scripts/copy-ort-wasm.mjs
        - npm audit --audit-level=moderate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
